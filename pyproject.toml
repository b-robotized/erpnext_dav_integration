[project]
name = "erpnext_dav_integration"
authors = [
    { name = "b-robotized group", email = "arun.govind@cloudconverge.io" }
]
description = "DAV (CalDAV/CardDAV) Integration for ERPNext"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
    "frappe>=15.0.0",
    "langcodes",
    "language-data"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Dev dependencies (optional)
[tool.bench.dev-dependencies]
# pytest = "~=7.4"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "UP030",
    "UP031",
    "UP032",
    "UP037",
    "UP040",
]

typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true